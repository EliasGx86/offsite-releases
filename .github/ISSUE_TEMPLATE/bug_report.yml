name: Something went wrong
description: A backup, restore, install, or screen that did not do what you expected.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — every report on a beta build is a gift. No GitHub account? Email elias.gomez@live.com instead.
  - type: input
    id: version
    attributes:
      label: Offsite version and computer
      description: "Settings → About shows the version. Say Windows 10/11 or macOS + chip (Apple Silicon / Intel)."
      placeholder: "v0.6.3, Windows 11"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: "What did you click, what did you expect, what did you see instead? Paste any error text."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Run log (optional)
      description: "For a failed backup: open the run in Backups → Run History and click Copy log, then paste here."
